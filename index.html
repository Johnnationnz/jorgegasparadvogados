const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(E.salt), iterations: E.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return new TextDecoder().decode(pt);
}
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
if (!(window.crypto && crypto.subtle)) { msg.className = "msg err"; msg.textContent = "Este navegador não permite abrir o site. Abra o endereço com https num navegador atualizado."; go.disabled = true; }
f.addEventListener("submit", async e => {
  e.preventDefault(); go.disabled = true; msg.className = "msg"; msg.textContent = "A abrir…";
  let html;
  try { html = await abrir(document.getElementById("pw").value); }
  catch (err) { msg.className = "msg err"; msg.textContent = "Palavra-passe errada. Tente de novo."; go.disabled = false; document.getElementById("pw").select(); return; }
  document.open(); document.write(html); document.close();
});
